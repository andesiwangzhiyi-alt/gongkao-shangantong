<style>

}
*{box-sizing:border-box}html{background:var(--paper-100)}body{margin:0;color:var(--text);background:var(--paper-100);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
button:focus-visible,input:focus-visible{outline:3px solid rgba(181,138,75,.45);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}

.brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px}.brand-mark{width:46px;height:46px;flex:0 0 46px}.brand-name strong{display:block;font:700 20px/1.2 var(--serif);letter-spacing:2px}.brand-name small{display:block;margin-top:4px;color:#d7cab3;font-size:10px;letter-spacing:1px}
.side-nav{display:grid;gap:6px}.nav-btn{width:100%;border:0;border-radius:11px;background:transparent;color:#dce3e5;padding:11px 13px;display:flex;align-items:center;gap:11px;text-align:left}.nav-btn .ico{width:23px;text-align:center;font-size:17px}.nav-btn:hover{background:rgba(255,255,255,.07)}.nav-btn.active{color:#fff;background:rgba(245,238,223,.14);box-shadow:inset 3px 0 var(--gold)}.nav-btn.ai-nav{margin-top:10px;color:#f1d7aa;border:1px solid rgba(181,138,75,.32)}
.side-foot{margin-top:auto;padding:20px 10px 0;border-top:1px solid rgba(255,255,255,.1)}.side-foot q{display:block;font:700 13px var(--serif);color:#f4dfb8}.side-foot small{display:block;margin-top:7px;color:#9fb0b6;font-size:10px}
.shell{min-width:0;min-height:100vh;background-image:linear-gradient(rgba(250,247,240,.88),rgba(250,247,240,.94)),var(--scene,url('../../assets/backgrounds/ink-mountains.webp'));background-size:cover;background-position:center;background-attachment:fixed}.topbar{height:72px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--paper-300);background:rgba(250,247,240,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:9}.crumb{display:flex;align-items:center;gap:10px}.mobile-brand,.mobile-name{display:none}.page-title{font:700 18px var(--serif);color:var(--ink-900)}.top-actions{display:flex;align-items:center;gap:10px}.streak{border:1px solid var(--paper-300);background:#fffaf1;color:#72552f;border-radius:99px;padding:7px 11px;font-size:12px}.ai-btn{border:0;border-radius:10px;background:var(--ink-700);color:white;padding:9px 13px;font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-700);background:#e9deca;font:700 14px var(--serif)}
.content{max-width:1370px;margin:auto;padding:28px 32px 94px}.eyebrow{color:var(--vermilion);font-size:11px;font-weight:800;letter-spacing:2px}.headline{margin:5px 0 6px;color:var(--ink-900);font:700 30px/1.25 var(--serif)}.subline{margin:0;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:23px}.main-col,.right-col{display:grid;gap:18px;align-content:start}.card{position:relative;background:rgba(255,253,248,.88);border:1px solid var(--paper-300);border-radius:16px;padding:20px;box-shadow:0 7px 24px rgba(16,43,58,.045)}.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.card-title h2,.card-title h3{margin:0;color:var(--ink-900);font:700 18px var(--serif)}.text-btn{border:0;background:transparent;color:var(--ink-500);padding:4px;font-size:12px}.primary{border:0;background:var(--ink-700);color:white;border-radius:10px;padding:11px 16px;font-weight:750}.secondary{border:1px solid var(--paper-400);background:#fffdf8;color:var(--ink-700);border-radius:10px;padding:10px 14px;font-weight:700}.primary:hover{background:var(--ink-900)}
.ability{overflow:hidden;min-height:252px;padding:25px;color:white;border:0;background:linear-gradient(135deg,#102b3a 0%,#17384c 58%,#315b6f 100%);box-shadow:var(--shadow)}.ability:before,.ability:after{content:"";position:absolute;border:1px solid rgba(245,238,223,.13);border-radius:50%}.ability:before{width:330px;height:130px;right:-55px;bottom:-82px}.ability:after{width:260px;height:100px;right:-20px;bottom:-70px}.ability-top{display:flex;align-items:start;justify-content:space-between;gap:20px}.ability-label{color:#d8e3e6;font-size:12px}.ability-value{margin:4px 0 0;font:700 52px/1 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}.ability-value span{font:500 13px var(--sans);color:#d3dee1;margin-left:6px;white-space:nowrap}.delta{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;color:#f1dfbd;background:rgba(181,138,75,.18);font-size:12px;white-space:nowrap}.surpass{margin:20px 0 3px;font:700 22px var(--serif)}.ability p{color:#c8d5d9;margin:0}.ability-actions{display:flex;gap:10px;margin-top:24px;position:relative;z-index:1}.ability .primary{background:#f5eedf;color:var(--ink-900)}.ability .secondary{border-color:rgba(255,255,255,.24);color:#fff;background:rgba(255,255,255,.06)}
.quest-list{display:grid;gap:10px}.quest{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:11px;padding:12px;border-radius:12px;background:#f8f3e8;border:1px solid transparent}.quest.done{background:#f0f4ec;color:#5b6a60}.quest.active{border-color:#d9c08f;background:#fffaf0}.quest-index{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--ink-700);background:#e8decc;font:700 12px var(--serif)}.quest.done .quest-index{color:white;background:var(--jade)}.quest strong{display:block;font-size:14px}.quest small{color:var(--muted)}.status{font-size:11px;color:var(--muted);padding:4px 8px;border-radius:99px;background:white}.quest.active .status{color:#765528;background:#f2e3c4}.quest.done .status{color:var(--jade)}
.progress-row{display:flex;justify-content:space-between;margin:0 0 12px}.progress-row strong{font:700 17px var(--serif);color:var(--ink-900)}.progress{height:7px;background:#e8dfce;border-radius:99px;overflow:hidden;margin-bottom:15px}.progress i{display:block;height:100%;width:67%;background:linear-gradient(90deg,var(--gold),var(--sun));border-radius:inherit}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:12px;border-radius:11px;background:#f7f2e8}.metric b{display:block;color:var(--ink-900);font:700 21px var(--serif)}.metric small{color:var(--muted)}
.continue-card{background:linear-gradient(120deg,#f5ecdc,#fffaf1)}.continue-card .stamp{position:absolute;right:17px;top:15px;color:var(--vermilion);border:1px solid currentColor;border-radius:6px;padding:3px 7px;font:700 11px var(--serif);transform:rotate(4deg)}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick{border:1px solid var(--paper-300);background:#fffdf8;border-radius:10px;padding:10px;text-align:left;color:var(--ink-700)}.quick span{display:block;font-size:18px}.quick small{color:var(--muted)}
.view-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.feature{min-height:170px;display:flex;flex-direction:column}.feature .symbol{font-size:25px;margin-bottom:18px}.feature h3{font:700 18px var(--serif);color:var(--ink-900);margin:0 0 6px}.feature p{color:var(--muted);margin:0 0 18px}.feature button{margin-top:auto;align-self:start}.feature.disabled{background:#f7f2e8}.feature.disabled .primary{background:#a8b0b2;cursor:not-allowed}.tag{display:inline-block;width:max-content;margin-bottom:10px;border-radius:99px;padding:4px 8px;color:#755b35;background:#eee2ca;font-size:10px;font-weight:700}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.module-list{display:grid;gap:9px}.module{display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:10px}.bar{height:8px;border-radius:99px;background:#e7dfd1;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink-500);border-radius:inherit}.module b{font-variant-numeric:tabular-nums;color:var(--ink-700)}
.empty-state{min-height:360px;display:grid;place-items:center;text-align:center;padding:40px}.empty-inner{max-width:470px}.watermark{width:92px;height:92px;margin:0 auto 17px;opacity:.28}.empty-state h2{margin:0 0 8px;color:var(--ink-900);font:700 23px var(--serif)}.empty-state p{color:var(--muted);margin:0 0 19px}.notice{border-left:3px solid var(--gold);background:#f5eddd;padding:11px 13px;color:#6f654f;border-radius:0 8px 8px 0;font-size:12px;text-align:left}
.subpage-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}.back{width:40px;height:40px;border:1px solid var(--paper-300);border-radius:10px;background:#fffdf8;color:var(--ink-700)}
.mobile-tabs{display:none}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:var(--ink-900);color:white;border-radius:10px;padding:10px 15px;box-shadow:var(--shadow);z-index:30;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body[data-scene="mountains"]{--scene:url('../../assets/backgrounds/ink-mountains.webp')}body[data-scene="lake"]{--scene:url('../../assets/backgrounds/misty-lake.webp')}body[data-scene="bamboo"]{--scene:url('../../assets/backgrounds/bamboo-study.webp')}body[data-scene="cloud"]{--scene:url('../../assets/backgrounds/cloud-ripples.webp')}body[data-scene="plum"]{--scene:url('../../assets/backgrounds/plum-shadow.webp')}body[data-scene="bridge"]{--scene:url('../../assets/backgrounds/willow-bridge.webp')}body[data-scene="moon"]{--scene:url('../../assets/backgrounds/moon-clouds.webp')}body[data-scene="lotus"]{--scene:url('../../assets/backgrounds/lotus-ripples.webp')}body[data-scene="paper"]{--scene:radial-gradient(circle at 30% 20%,rgba(181,138,75,.07),transparent 36%),linear-gradient(120deg,#faf7f0,#f3eddf)}body[data-scene="none"] .shell{background-image:none;background-color:var(--paper-100)}
.ai-composer{border:1px solid #d9c08f;background:rgba(255,252,244,.93)}.ai-composer-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.ai-composer-head h3{margin:0;color:var(--ink-900);font:700 18px var(--serif)}.ai-note{margin:6px 0 12px;color:var(--muted);font-size:12px}.prompt-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.prompt-chip{border:1px solid var(--paper-300);border-radius:99px;background:#fffdf8;color:var(--ink-500);padding:6px 9px;font-size:11px}.composer-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:7px}.composer-row textarea{resize:none;min-height:44px;max-height:110px;border:1px solid var(--paper-400);border-radius:10px;padding:10px;background:#fff;color:var(--text)}.mic{width:44px;height:44px;border:1px solid var(--paper-400);border-radius:50%;background:#fffdf8;color:var(--ink-700);font-size:17px}.mic.recording{color:#fff;background:var(--vermilion);animation:pulse 1.2s infinite}.send{border:0;border-radius:10px;background:var(--ink-700);color:#fff;padding:0 14px;font-weight:700}.context-line{margin-top:8px;color:var(--muted);font-size:10px}.question-demo{max-width:850px;margin:auto}.question-demo .option{padding:11px 13px;margin:8px 0;border:1px solid var(--paper-300);border-radius:10px;background:#fff}.original-explain{margin-top:16px;border-left:4px solid var(--jade);background:#f1f5ef}.ask-explain{margin-top:14px;border-color:#d9c08f;background:rgba(255,250,239,.95)}.setting-list{display:grid;gap:14px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--paper-300)}.setting-row:last-child{border-bottom:0}.scene-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.scene-choice{border:2px solid transparent;border-radius:10px;padding:7px;background:#f6f0e4;color:var(--ink-700)}.scene-choice.active{border-color:var(--gold)}.scene-thumb{display:block;height:48px;border-radius:6px;background-size:cover;background-position:center;margin-bottom:5px}.toggle{width:48px;height:27px;border:0;border-radius:99px;background:#aab3b5;padding:3px}.toggle i{display:block;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--jade)}.toggle.on i{transform:translateX(21px)}.ripple-wave{position:fixed;z-index:999;pointer-events:none;width:18px;height:18px;border:2px solid rgba(49,91,111,.22);border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:waterRipple .55s ease-out forwards}@keyframes waterRipple{to{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(166,75,60,.12)}}
@media(max-width:1100px){.app{grid-template-columns:82px minmax(0,1fr)}.sidebar{padding-inline:10px}.brand{justify-content:center;padding-inline:0}.brand-name,.nav-btn .label,.side-foot{display:none}.nav-btn{justify-content:center;padding:12px}.nav-btn .ico{font-size:20px}.dashboard-grid,.workbench{grid-template-columns:1fr}.right-col{grid-template-columns:repeat(2,minmax(0,1fr))}.right-col .continue-card{grid-column:1/-1}}
@media(max-width:767px){body{padding-bottom:72px}.shell{background-attachment:scroll;background-position:55% top}.app{display:block}.sidebar{display:none}.topbar{height:62px;padding:0 16px}.crumb{gap:8px}.mobile-brand{display:block;width:32px;height:32px}.mobile-name{display:block;color:var(--ink-900);font:700 15px var(--serif);white-space:nowrap}.page-title{font:500 12px var(--sans);color:var(--muted);padding-left:8px;border-left:1px solid var(--paper-300)}.streak,.avatar{display:none}.ai-btn{width:40px;height:40px;padding:0;font-size:0}.ai-btn:after{content:"✦";font-size:17px}.content{padding:20px 16px 45px}.headline{font-size:25px}.dashboard-grid{display:block;margin-top:18px}.main-col,.right-col{display:grid;gap:14px}.right-col{margin-top:14px;grid-template-columns:1fr}.right-col .continue-card{grid-column:auto}.ability{min-height:285px;padding:21px}.ability-value{font-size:46px}.surpass{font-size:19px}.ability-actions{display:grid;grid-template-columns:1fr 1fr}.card{padding:17px}.section-grid{grid-template-columns:1fr}.feature{min-height:auto}.view-head{display:block}.workbench{display:block}.workbench>aside{margin-top:14px}.metric-grid{grid-template-columns:repeat(3,1fr)}.mobile-tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;height:68px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(250,247,240,.97);border-top:1px solid var(--paper-300);backdrop-filter:blur(15px)}.mobile-tab{border:0;background:transparent;color:#5f6e73;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px}.mobile-tab span{font-size:19px;line-height:1}.mobile-tab.active{color:var(--ink-700);font-weight:800}.mobile-tab.active:before{content:"";position:absolute;top:0;width:28px;border-top:3px solid var(--gold)}.toast{bottom:86px;white-space:nowrap}.empty-state{min-height:300px;padding:28px 12px}}
@media(max-width:600px){.scene-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:360px){.ability-actions{grid-template-columns:1fr}.composer-row{grid-template-columns:44px minmax(0,1fr)}.composer-row .send{grid-column:2;height:42px}.prompt-chips{display:grid;grid-template-columns:1fr 1fr}.scene-grid{grid-template-columns:repeat(2,1fr)}.metric-grid{gap:6px}.metric{padding:9px}.metric b{font-size:18px}.quest{grid-template-columns:34px minmax(0,1fr)}.quest .status{grid-column:2}.headline{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}.ripple-wave{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="致泽学堂主导航">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="致泽学堂泽印书页图标"><rect x="3" y="3" width="58" height="58" rx="15" fill="#f5eedf"/><path d="M16 20 Q32 13 48 20" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round"/><path d="M18 25 Q25 24 31 29 V43 Q25 38 18 39Z M46 25 Q39 24 33 29 V43 Q39 38 46 39Z" fill="#17384c"/><path d="M17 47 Q32 42 47 47 M21 52 Q32 48 43 52" fill="none" stroke="#b58a4b" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div class="brand-name"><strong>致泽学堂</strong><small>以学致知 · 以行泽民</small></div>
    </div>
    <nav class="side-nav">
      <button class="nav-btn active" data-view="dashboard"><span class="ico">⌂</span><span class="label">学堂首页</span></button>
      <button class="nav-btn" data-view="practice"><span class="ico">卷</span><span class="label">行测研习</span></button>
      <button class="nav-btn" data-view="shenlun"><span class="ico">文</span><span class="label">申论书房</span></button>
      <button class="nav-btn" data-view="growth"><span class="ico">升</span><span class="label">修业成长</span></button>
      <button class="nav-btn ai-nav" data-view="ai"><span class="ico">✦</span><span class="label">问泽</span></button>
      <button class="nav-btn" data-view="profile"><span class="ico">我</span><span class="label">我的书斋</span></button>
    </nav>
    <div class="side-foot"><q>以学致知，以行泽民</q><small>致泽学堂 · 融合版设计预览</small></div>
  </aside>

  <section class="shell">
    <header class="topbar">
      <div class="crumb">
        <svg class="mobile-brand" viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="15" fill="#17384c"/><path d="M16 20 Q32 13 48 20" fill="none" stroke="#f5eedf" stroke-width="3.5" stroke-linecap="round"/><path d="M18 25 Q25 24 31 29 V43 Q25 38 18 39Z M46 25 Q39 24 33 29 V43 Q39 38 46 39Z" fill="#f5eedf"/><path d="M17 47 Q32 42 47 47 M21 52 Q32 48 43 52" fill="none" stroke="#b58a4b" stroke-width="2.5"/></svg>
        <span class="mobile-name">致泽学堂</span>
        <span class="page-title" id="pageTitle">首页</span>
      </div>
      <div class="top-actions"><span class="streak">连续学习 <b>7</b> 天</span><button class="ai-btn" data-view="ai">✦ 问泽</button><span class="avatar">泽</span></div>
    </header>
    <main class="content" id="content"></main>
  </section>
</div>

<nav class="mobile-tabs" aria-label="移动端主导航">
  <button class="mobile-tab active" data-view="dashboard"><span>⌂</span>首页</button>
  <button class="mobile-tab" data-view="practice"><span>卷</span>行测</button>
  <button class="mobile-tab" data-view="shenlun"><span>文</span>申论</button>
  <button class="mobile-tab" data-view="growth"><span>升</span>成长</button>
  <button class="mobile-tab" data-view="profile"><span>我</span>我的</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="brandWatermark"><svg class="watermark" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 30 Q50 15 80 30" fill="none" stroke="#17384c" stroke-width="5" stroke-linecap="round"/><path d="M24 39 Q37 36 48 47 V70 Q37 60 24 62Z M76 39 Q63 36 52 47 V70 Q63 60 76 62Z" fill="#17384c"/><path d="M22 78 Q50 67 78 78 M30 87 Q50 80 70 87" fill="none" stroke="#b58a4b" stroke-width="4" stroke-linecap="round"/></svg></template>
<script>
const titles={dashboard:'学堂首页',practice:'行测研习',shenlun:'申论书房',growth:'修业成长',ai:'问泽',profile:'我的书斋'};
const content=document.querySelector('#content');
const watermark=()=>document.querySelector('#brandWatermark').innerHTML;
const toast=msg=>{const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800)};
